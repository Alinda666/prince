<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - PRINCE ONLINE SHOP</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #ff6600;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #ff6600;
            text-decoration: none;
            font-weight: bold;
        }

        .cart-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }

        .product-name {
            font-size: 20px;
            font-weight: bold;
        }

        .product-price {
            color: #666;
            margin-top: 5px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: #ff6600;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        .quantity span {
            min-width: 30px;
            text-align: center;
            font-weight: bold;
        }

        .item-total {
            font-weight: bold;
            font-size: 18px;
        }

        .remove-button {
            background: #e53935;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        .remove-button:hover {
            opacity: 0.85;
        }

        .summary {
            margin-top: 30px;
            padding: 25px;
            background: #fafafa;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .total-row {
            border-top: 1px solid #ddd;
            padding-top: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #ff6600;
        }

        .cart-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .continue-shopping,
        .checkout-button {
            flex: 1;
            padding: 16px;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 17px;
        }

        .continue-shopping {
            background: #222;
            color: white;
        }

        .checkout-button {
            background: #ff6600;
            color: white;
        }

        .continue-shopping:hover,
        .checkout-button:hover {
            opacity: 0.85;
        }

        /* EMPTY CART */

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            border: 1px dashed #ccc;
            border-radius: 10px;
        }

        .empty-cart h2 {
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 25px;
        }

        .shop-button {
            display: inline-block;
            background: #222;
            color: white;
            padding: 13px 22px;
            border-radius: 8px;
            text-decoration: none;
        }

        @media (max-width: 700px) {

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .cart-buttons {
                flex-direction: column;
            }

        }
    </style>
</head>

<body>

<header>
    <h1>PRINCE ONLINE SHOP</h1>
</header>

<div class="container">

    <a href="index.html" class="back">
        ← Continue Shopping
    </a>

    <div class="cart-box">

        <h2>Your Shopping Cart</h2>

        <!-- CART PRODUCTS APPEAR HERE -->
        <div id="cart-items"></div>

        <!-- SUMMARY -->
        <div class="summary">

            <div class="summary-row">
                <span>Subtotal</span>
                <strong id="cart-subtotal">UGX 0</strong>
            </div>

            <div class="summary-row total-row">
                <span>Total</span>
                <strong id="cart-total">UGX 0</strong>
            </div>

            <div class="cart-buttons">

                <a
                    href="index.html"
                    class="continue-shopping">
                    Continue Shopping
                </a>

                <a
                    href="checkout.html"
                    class="checkout-button">
                    Checkout
                </a>

            </div>

        </div>

    </div>

</div>

<!-- IMPORTANT -->
<script src="cart.js"></script>

</body>
</html>
