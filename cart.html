<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - PRINCE ONLINE SHOP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Poppins', Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #ff6600;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #ff6600;
            text-decoration: none;
            font-weight: 600;
        }

        .cart-box {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            font-size: 32px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 25px 0;
            border-bottom: 1px solid #ddd;
        }

        .product-info h3 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .product-info p {
            margin: 5px 0;
            color: #666;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quantity button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 8px;
            background: #ff6600;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        .quantity button:hover {
            background: #e65c00;
        }

        .quantity span {
            min-width: 30px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .item-total {
            font-weight: bold;
            font-size: 18px;
        }

        .remove {
            background: #e53935;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .remove:hover {
            background: #c62828;
        }

        .summary {
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            background: #fafafa;
            border: 1px solid #ddd;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .total {
            font-size: 28px;
            font-weight: 700;
            color: #ff6600;
            border-top: 1px solid #ddd;
            padding-top: 20px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .continue,
        .checkout {
            flex: 1;
            padding: 16px;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 17px;
        }

        .continue {
            background: #222;
            color: white;
        }

        .checkout {
            background: #ff6600;
            color: white;
        }

        .continue:hover {
            background: #333;
        }

        .checkout:hover {
            background: #e65c00;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-cart h3 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #666;
            margin-bottom: 25px;
        }

        .shop-button {
            display: inline-block;
            padding: 14px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        @media (max-width: 700px) {

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .buttons {
                flex-direction: column;
            }

            .summary-row {
                font-size: 18px;
            }

        }
    </style>
</head>

<body>

<header>
    <h1>PRINCE ONLINE SHOP</h1>
</header>

<div class="container">

    <a href="index.html" class="back">
        ← Continue Shopping
    </a>

    <div class="cart-box">

        <h2>Your Shopping Cart</h2>

        <!-- PRODUCTS WILL APPEAR HERE -->
        <div id="cart-items"></div>

        <!-- ORDER SUMMARY -->
        <div id="cart-summary" class="summary">

            <div class="summary-row">
                <span>Subtotal</span>
                <strong id="cart-subtotal">UGX 0</strong>
            </div>

            <div class="summary-row total">
                <span>Total</span>
                <strong id="cart-total">UGX 0</strong>
            </div>

            <div class="buttons">

                <a href="index.html" class="continue">
                    Continue Shopping
                </a>

                <a href="checkout.html" class="checkout">
                    Checkout
                </a>

            </div>

        </div>

    </div>

</div>


<!-- CART JAVASCRIPT -->
<script src="cart.js"></script>

</body>
</html>
