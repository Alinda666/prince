<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Shop - PRINCE ONLINE SHOP</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .shop-page {
            padding: 50px 6%;
        }

        .shop-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .shop-title h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .shop-title p {
            color: #777;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            padding-bottom: 20px;
            text-align: center;
        }

        .product-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .discount {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #ff6600;
            color: white;
            padding: 10px 15px;
            border-radius: 25px;
            font-weight: bold;
        }

        .product-card h3 {
            font-size: 21px;
            margin: 20px 10px 10px;
        }

        .price {
            margin: 10px;
        }

        .old {
            color: #999;
            text-decoration: line-through;
            margin-right: 10px;
        }

        .new {
            color: #ff6600;
            font-size: 22px;
            font-weight: bold;
        }

        .product-card button {
            border: none;
            background: #ff6600;
            color: white;
            padding: 14px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .product-card button:hover {
            background: #e65c00;
        }

        @media (max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            <a href="index.html">
                PRINCE ONLINE SHOP
            </a>
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="shop.html">Shop</a>

            <a href="about.html">About</a>

            <a href="contact.html">Contact</a>

            <a href="cart.html">🛒 Cart</a>

        </nav>

    </header>


    <!-- SHOP -->

    <main class="shop-page">

        <div class="shop-title">

            <h1>Shop Our Products</h1>

            <p>
                Discover amazing products at great prices.
            </p>

        </div>


        <div class="products">


            <!-- PRODUCT 1 -->

            <div class="product-card">

                <span class="discount">-35%</span>

                <img src="phone.jpg"
                     alt="iPhone 16">

                <h3>iPhone 16</h3>

                <div class="price">

                    <span class="old">
                        UGX 12,000
                    </span>

                    <span class="new">
                        UGX 7,800
                    </span>

                </div>

                <button
                    onclick="addToCart('iPhone 16', 7800)">
                    Add To Cart
                </button>

            </div>


            <!-- PRODUCT 2 -->

            <div class="product-card">

                <span class="discount">-60%</span>

                <img src="laptop.jpg"
                     alt="Gaming Laptop">

                <h3>Gaming Laptop</h3>

                <div class="price">

                    <span class="old">
                        UGX 1,400,000
                    </span>

                    <span class="new">
                        UGX 840,000
                    </span>

                </div>

                <button
                    onclick="addToCart('Gaming Laptop', 840000)">
                    Add To Cart
                </button>

            </div>


            <!-- PRODUCT 3 -->

            <div class="product-card">

                <span class="discount">-35%</span>

                <img src="watch.jpg"
                     alt="Luxury Watch">

                <h3>Luxury Watch</h3>

                <div class="price">

                    <span class="old">
                        UGX 250,000
                    </span>

                    <span class="new">
                        UGX 99,000
                    </span>

                </div>

                <button
                    onclick="addToCart('Luxury Watch', 99000)">
                    Add To Cart
                </button>

            </div>


            <!-- PRODUCT 4 -->

            <div class="product-card">

                <span class="discount">-40%</span>

                <img src="kitchen ceramic tiles.jpg"
                     alt="Ceramic Tiles">

                <h3>Ceramic Tiles</h3>

                <div class="price">

                    <span class="old">
                        UGX 45,000
                    </span>

                    <span class="new">
                        UGX 42,000
                    </span>

                </div>

                <button
                    onclick="addToCart('Ceramic Tiles', 42000)">
                    Add To Cart
                </button>

            </div>


        </div>

    </main>


    <!-- CART JAVASCRIPT -->

    <script src="cart.js"></script>

</body>

</html>
